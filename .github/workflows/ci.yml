name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo a la misma rama o PR cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  API_IMAGE: mibici-api:1.2
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/mibici-api

jobs:
  checks:
    name: Lint, pruebas y seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make lint
      # Las pruebas usan datos sintéticos: los datos de MiBici no están en el repositorio.
      - run: make test
      # bandit sobre el código y pip-audit sobre las dependencias instaladas.
      - run: make security

  image:
    name: Imagen y sistema con Compose
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Capas en la caché de GitHub Actions: si no cambia requirements-api.txt, pip no corre.
      - name: Construir la imagen de la API (Containerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          load: true
          tags: |
            ${{ env.API_IMAGE }}
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validar docker-compose.yml
        run: docker compose config --quiet

      # El servidor de MLflow escribe mlflow.db y mlartifacts/ en el checkout del runner,
      # así que corre con el usuario del runner.
      - name: Levantar MLflow y la API con un solo comando
        run: |
          echo "MLFLOW_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "MLFLOW_GID=$(id -g)" >> "$GITHUB_ENV"
          MLFLOW_UID=$(id -u) MLFLOW_GID=$(id -g) docker compose up -d --wait --wait-timeout 180
          docker compose ps

      - name: Probar el sistema de punta a punta
        run: |
          set -euo pipefail
          curl -fsS http://localhost:5001/health; echo
          curl -fsS http://localhost:8000/health; echo
          curl -fsS http://localhost:8000/models; echo
          # Registry vacío: la API llega al servicio mlflow y responde 503 con el motivo.
          code=$(curl -s -o /tmp/p1.json -w '%{http_code}' -X POST http://localhost:8000/predict/p1 \
            -H 'Content-Type: application/json' -d @examples/api/p1.json)
          cat /tmp/p1.json; echo
          test "$code" = 503
          grep -q RESOURCE_DOES_NOT_EXIST /tmp/p1.json
          # Modelo de humo en el registry: la API lo descarga por la red de Compose y predice.
          docker compose exec -T mlflow python scripts/compose_smoke_model.py
          curl -fsS -X POST http://localhost:8000/predict/p1 \
            -H 'Content-Type: application/json' -d @examples/api/p1.json | tee /tmp/p1.json; echo
          grep -q '"source":"registry"' /tmp/p1.json
          # Petición inválida: 422.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/predict/p1 \
            -H 'Content-Type: application/json' -d @examples/api/p1_invalido.json)
          test "$code" = 422

      - name: Logs de los servicios
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail=100

      - name: Detener los servicios
        if: always()
        run: docker compose down

      # Solo en main: la imagen ya probada se publica en GitHub Container Registry.
      - name: Iniciar sesión en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar la imagen en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY_IMAGE }}:latest
