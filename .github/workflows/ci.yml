name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make lint
      # Las pruebas usan datos sintéticos: los datos de MiBici no están en el repositorio.
      - run: make test
      # bandit sobre el código y pip-audit sobre las dependencias instaladas.
      - run: make security
